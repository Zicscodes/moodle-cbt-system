services:
  moodleapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: moodle-web:1.0
    container_name: moodle-web
    ports:
      - 8080:80
    volumes:
      - moodledata:/var/www/moodledata
      - ./moodle:/var/www/html
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    container_name: moodle-db
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodleuser
      POSTGRES_PASSWORD: moodle_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  moodledata:
  moodlecode: